apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    namespace "com.mod.menu"

    defaultConfig {
        applicationId "com.joynow.monster.gp"   // SAMA DENGAN GAME agar resource ter-inject
        minSdkVersion 16
        targetSdkVersion 33
        versionCode 234
        versionName "2.3.4-MOD"
        multiDexEnabled false

        externalNativeBuild {
            ndkBuild {
                abiFilters 'armeabi-v7a'     // Game menggunakan armeabi 32-bit
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            jni.srcDirs = []
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
