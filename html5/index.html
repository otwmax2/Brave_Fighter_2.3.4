<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Brave Fighter HTML5 — 萌兽獵人 Web Port</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; color:#fff; user-select:none; touch-action:manipulation; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0b0814; }
canvas { background:linear-gradient(#2b4f8b 0%, #5a9ed3 60%, #9cc780 61%, #3c7a28 100%); display:block; image-rendering:pixelated; box-shadow:0 0 30px rgba(0,0,0,0.8); }
#ui { position:absolute; inset:0; pointer-events:none; }
.screen { position:absolute; inset:0; display:flex; flex-direction:column; pointer-events:auto; }
.hidden { display:none !important; }
.panel { background:rgba(10,10,30,0.85); backdrop-filter:blur(4px); border:2px solid #f2c744; border-radius:12px; padding:12px; overflow-y:auto; }
button { background:linear-gradient(#ffd95a,#e09612); border:2px solid #8b5a00; color:#3b1e00; font-weight:bold; padding:8px 14px; border-radius:8px; font-size:14px; cursor:pointer; pointer-events:auto; box-shadow:0 2px 0 #6b4600; transition:transform .05s; }
button:active { transform:translateY(2px); box-shadow:0 0 0 #6b4600; }
button:disabled { background:#666; border-color:#333; color:#aaa; box-shadow:none; }
.btn-red { background:linear-gradient(#ff7979,#c62828); border-color:#600; color:#fff; box-shadow:0 2px 0 #600; }
.btn-blue { background:linear-gradient(#6ec8ff,#1565c0); border-color:#0d3b70; color:#fff; box-shadow:0 2px 0 #0d3b70; }
.btn-green { background:linear-gradient(#86e074,#2e7d32); border-color:#1b4010; color:#fff; box-shadow:0 2px 0 #1b4010; }
h1,h2,h3 { text-shadow:2px 2px 0 #000, -1px -1px 0 #000; }
.title { text-align:center; font-size:32px; color:#ffd95a; margin-bottom:6px; text-shadow:3px 3px 0 #600, -2px -2px 0 #600; letter-spacing:2px; }
.subtitle { text-align:center; color:#ccc; margin-bottom:12px; font-size:13px; }
.col { display:flex; flex-direction:column; gap:8px; }
.row { display:flex; flex-direction:row; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; }
.bar { height:20px; background:#222; border:1px solid #000; border-radius:10px; overflow:hidden; position:relative; }
.bar > .fill { height:100%; background:linear-gradient(#ff3030,#b50000); transition:width .2s; }
.bar.mp > .fill { background:linear-gradient(#30d8ff,#0062b5); }
.bar > .lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; text-shadow:1px 1px 0 #000; }
.card { background:rgba(0,0,0,0.5); border:2px solid #777; border-radius:8px; padding:8px; }
.card.owned { border-color:#4CAF50; }
.card.selected { border-color:#ffd95a; box-shadow:0 0 8px #ffd95a; }
.chip { display:inline-block; padding:2px 6px; border-radius:6px; font-size:11px; background:#222; border:1px solid #444; margin:1px; }
.chip.hero { background:#1b5e20; border-color:#4CAF50; color:#b9f6ca; }
.chip.cost { background:#7a4f00; border-color:#ffc107; color:#fff176; }
.modal-bg { position:absolute; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:999; pointer-events:auto; }
.modal { background:#1a1020; border:3px solid #f2c744; border-radius:14px; padding:16px; max-width:90%; max-height:80%; overflow-y:auto; }
.flash { animation:flash .3s; }
@keyframes flash { 0%{background:rgba(255,255,100,0.5);} 100%{background:transparent;} }
.dmg-txt { position:absolute; color:#fff; font-weight:bold; font-size:14px; text-shadow:1px 1px 0 #000; pointer-events:none; }
.tab { padding:6px 12px; background:#222; color:#aaa; border:1px solid #444; border-radius:6px 6px 0 0; cursor:pointer; font-size:13px; pointer-events:auto; }
.tab.active { background:#1a1020; color:#ffd95a; border-color:#f2c744; border-bottom-color:#1a1020; }
#hud { position:absolute; top:0; left:0; right:0; padding:6px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
#hud .stats { display:flex; gap:8px; flex-direction:column; }
.stat { background:rgba(0,0,0,0.55); border:1px solid #f2c744; border-radius:6px; padding:2px 8px; font-size:13px; }
.stat b { color:#ffd95a; }
#skillBar { position:absolute; bottom:0; left:0; right:0; padding:6px; display:flex; gap:6px; justify-content:center; pointer-events:none; }
.skill-btn { width:56px; height:56px; border-radius:50%; background:radial-gradient(circle,#5e8ef2,#1a2b70); border:3px solid #ffd95a; position:relative; pointer-events:auto; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; text-align:center; font-weight:bold; }
.skill-btn.cd::after { content:''; position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.6); }
.skill-btn .cd-t { position:absolute; font-size:16px; text-shadow:1px 1px 0 #000; z-index:2; }
.skill-btn.ready { box-shadow:0 0 12px #6ec8ff; }
#battleLog { position:absolute; left:6px; bottom:80px; max-height:100px; overflow:hidden; font-size:11px; color:#fff; text-shadow:1px 1px 0 #000; pointer-events:none; }
</style>
</head>

    <div id="screen-town" class="screen hidden">

      <div id="tab-team" class="tab-pane" style="flex:1; padding:8px; overflow-y:auto;">

        <h3 style="margin:8px 0 6px;">英雄圖鑑（點擊招募/升級）</h3>
        <div class="row" id="heroList"></div>
      </div>

        <h3 style="margin-bottom:6px;">商店（點擊購買）</h3>
        <div class="row" id="shopList"></div>
      </div>

        <div class="row" id="skillSlots" style="margin-bottom:8px;"></div>
        <h3 style="margin:8px 0 6px;">已學習</h3>
        <div class="row" id="skillList"></div>
      </div>
    </div>

    <!-- =============== BATTLE =============== -->
    <div id="screen-battle" class="screen hidden">
      <div id="hud">
        <div class="stats">
          <div class="stat">第 <b id="b-level">1</b> 關 · Wave <b id="b-wave">1</b>/<b id="b-waves">2</b></div>

        </div>

        </div>
      </div>
      <div id="battleLog"></div>
      <div id="skillBar"></div>
    </div>

        <div id="modal-btns" class="row"></div>
      </div>
    </div>

  </div>
</div>

// Monster type colors (for procedural rendering, no real sprite atlases needed)
const TYPE_COLORS = {
  0:{body:'#8d6e63', trim:'#4e342e', name:'肉盾'}, // tank/melee
  1:{body:'#e53935', trim:'#7f0000', name:'敏捷'}, // agile/melee
  2:{body:'#1e88e5', trim:'#0d47a1', name:'強攻'}, // ranged/magic
  3:{body:'#8e24aa', trim:'#4a148c', name:'遠攻'}, // ranged
  4:{body:'#43a047', trim:'#1b5e20', name:'輔助'}, // support/heal
};
const QUALITY_COLORS = ['#9e9e9e','#42a5f5','#9c27b0','#ff9800','#f44336'];

// ---------- SAVE SYSTEM ----------
const SAVE_KEY = 'bravefighter_html5_save_v1';
const DEFAULT_SAVE = {
  gold: 500, gem: 20,
  ownedHeroes: {0:{level:1,exp:0}}, // id -> {level,exp}
  team: [0,-1,-1,-1,-1],           // max 5 slots, -1 = empty
  ownedSkills: {0:true,3:true},    // start with 2 basic skills
  skillBar: [0,3,-1],              // 3 hotkeys
  clearedLevels: [],               // ids of cleared levels
  unlockedLevelId: 0,
  buffs: {},                       // purchased permanent buffs
  potions: 2, scrolls: 1,
};
let SAVE = loadSave();
function loadSave(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s) return Object.assign({}, DEFAULT_SAVE, s);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_SAVE));
}
function save(){ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }

// ---------- HELPERS ----------
function $(id){ return document.getElementById(id); }
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function dist(a,b){ return Math.abs(a.x-b.x); }
function showModal(title, body, buttons){
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = body;
  const bc = $('modal-btns'); bc.innerHTML='';
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if(b.cls) btn.className = b.cls;
    btn.onclick = ()=>{ $('modal').classList.add('hidden'); if(b.onClick) b.onClick(); };
    bc.appendChild(btn);
  });
  $('modal').classList.remove('hidden');
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'dmg-txt';
  el.style.left = '50%'; el.style.top = '20%'; el.style.transform='translateX(-50%)';
  el.style.fontSize='16px'; el.style.color='#ffd95a'; el.textContent=msg;
  $('ui').appendChild(el);
  let y=20, op=1;
  const iv=setInterval(()=>{y-=0.5;op-=0.02;el.style.top=y+'%';el.style.opacity=op;if(op<=0){clearInterval(iv);el.remove();}},30);
}

// ---------- SCREEN MANAGER ----------
function goto(name){
  ['menu','stage','town','battle'].forEach(s=>$('screen-'+s).classList.add('hidden'));
  $('screen-'+name).classList.remove('hidden');
  if(name==='stage') renderStage();
  if(name==='town') renderTown();
}

// ---------- CANVAS ----------
const canvas = $('game');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  const ratio = 16/9;
  const ww = window.innerWidth, wh = window.innerHeight;
  let w=ww, h=ww/ratio;
  if(h>wh){ h=wh; w=wh*ratio; }
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
}
window.addEventListener('resize', resizeCanvas); resizeCanvas();

// ---------- PROCEDURAL SPRITE DRAW ----------
function drawCharacter(ctx, x, y, mon, team, facing, animT, hpPct, mpPct, isAttacking, isDead, isBoss){
  // team: 0=player (left), 1=enemy (right). facing: -1=left, 1=right
  const scale = (mon.defaultscale||1) * (isBoss?1.6:1);
  const W = (mon.Width||50)*scale, H = (mon.Height||100)*scale;
  const cx = x, by = y;
  const color = TYPE_COLORS[mon.type] || TYPE_COLORS[0];
  const qcolor = QUALITY_COLORS[mon.quality] || '#9e9e9e';
  if(isDead){ ctx.globalAlpha=0.4; }

  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(facing,1);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0,2,W*0.4,6,0,0,Math.PI*2); ctx.fill();
  // body bounce
  const bob = Math.sin(animT*6)*2;
  ctx.translate(0, bob);
  // legs (two small rectangles)
  ctx.fillStyle = color.trim;
  ctx.fillRect(-W*0.25,-H*0.25,W*0.2,H*0.25);
  ctx.fillRect(W*0.05,-H*0.25,W*0.2,H*0.25);
  // body (rounded rect)
  ctx.fillStyle = color.body;
  roundRect(ctx,-W*0.4,-H*0.8,W*0.8,H*0.6,10*scale); ctx.fill();
  // body outline (quality color)
  ctx.strokeStyle = qcolor; ctx.lineWidth = 2.5*scale;
  roundRect(ctx,-W*0.4,-H*0.8,W*0.8,H*0.6,10*scale); ctx.stroke();
  // head circle
  ctx.fillStyle = color.body;
  ctx.beginPath(); ctx.arc(0,-H*0.85,W*0.28,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = qcolor; ctx.stroke();
  // eyes
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(W*0.08,-H*0.88,W*0.08,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-W*0.1,-H*0.88,W*0.08,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000';
  ctx.beginPath(); ctx.arc(W*0.1,-H*0.88,W*0.04,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-W*0.08,-H*0.88,W*0.04,0,Math.PI*2); ctx.fill();
  // weapon/attack indicator
  if(isAttacking){
    ctx.fillStyle = '#fff176';
    ctx.beginPath();
    ctx.moveTo(W*0.3,-H*0.6);
    ctx.lineTo(W*0.9,-H*0.5);
    ctx.lineTo(W*0.3,-H*0.4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#b28704'; ctx.stroke();
  }
  // quality star if boss/rare
  if((mon.quality||0)>=3){
    ctx.fillStyle='#ffeb3b';
    ctx.font = `${14*scale}px sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('★',0,-H*1.1);
  }
  ctx.restore();

  // HP / MP bar
  if(!isDead){
    const bw=W, bh=5;
    ctx.fillStyle='#000'; ctx.fillRect(cx-bw/2,by-8-bh-12,bw,bh+2);
    ctx.fillStyle='#c62828'; ctx.fillRect(cx-bw/2+1,by-8-bh-11,(bw-2)*hpPct,bh);
  }
  ctx.globalAlpha=1;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function drawProjectile(ctx,x,y,color,isHeal){
  ctx.save();
  if(isHeal){
    ctx.fillStyle='#66ff66';
    ctx.beginPath(); ctx.arc(x,y,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(x-1,y-5,2,10); ctx.fillRect(x-5,y-1,10,2);
  }else{
    ctx.fillStyle=color||'#ff5722';
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  }
  ctx.restore();
}

// ---------- BATTLE ENGINE ----------
const BATTLE = {
  active:false,
  allies:[], enemies:[], projectiles:[], effects:[],
  waves:[], curWave:0, spawnQueue:[],
  groundY: 440, // in canvas coords (origin top-left)
  time:0, lastSpawn:0,
  level:null, speedMult:1,
  result:null,
  gold:0,
  bgScroll:0,
};

function getEnemyById(lookupId){
  // enemy di XML: musuh yang muncul di stage ada di enemies list, "CharacterId" di EnemyGroup mengacu pada id musuh
  // Dari XML, enemy CharacterId=0..8 tampaknya mengacu pada id 12-19 (drop mobs), tapi untuk kemudahan,
  // kita petakan secara deterministik: id 0..len(enemies)-1
  const pool = GAMEDATA.enemies.filter(e=>e.type!==undefined);
  // enemies dengan id 12-19 adalah musuh normal, id 20+ boss
  const normals = pool.filter(e=>(e.id>=12 && e.id<20) || (e.id>=46 && e.id<=50));
  const bosses = pool.filter(e=>e.id>=20 && e.id<46);
  if(lookupId===-1) return normals[randi(0,normals.length-1)];
  // lookupId dari EnemyGroup CharacterId (0..)
  if(lookupId < normals.length) return normals[lookupId] || normals[0];
  return bosses[lookupId-normals.length] || bosses[0];
}

function makeUnit(monsterData, isAlly, xpos, slotIdx){
  const lv = isAlly ? (SAVE.ownedHeroes[monsterData.id]?.level || 1) : 1;
  // scale stat dengan level untuk hero
  const lvMul = isAlly ? (1 + (lv-1)*0.12) : 1;
  const hp = Math.floor((monsterData.hp||200)*lvMul);
  return {
    mon: monsterData,
    isAlly, x:xpos, y: BATTLE.groundY,
    hp, maxHp:hp,
    mp:0, maxMp:100,
    atk: Math.floor((monsterData.damage||50)*lvMul),
    def: (monsterData.defense||5),
    speed: monsterData.movespeed||60, // px/sec
    range: monsterData.attackrange||100,
    atkCooldown: (monsterData.attackDelt||2.5),
    atkTimer: rand(0,1),
    isAttacking:false, atkAnimT:0,
    slot:slotIdx,
    animT: Math.random()*10,
    alive:true,
    facing: isAlly?1:-1,
    isBoss: (monsterData.quality||0)>=3 && !isAlly && (monsterData.id>=20),
    stateTimer:0, stunned:0, slowed:0,
  };
}

function startBattle(levelId){
  const lv = GAMEDATA.levels.find(l=>l.id===levelId);
  if(!lv){ toast('關卡不存在'); return; }
  BATTLE.level = lv;
  BATTLE.waves = lv.waves;
  BATTLE.curWave = 0;
  BATTLE.allies = []; BATTLE.enemies = []; BATTLE.projectiles=[]; BATTLE.effects=[];
  BATTLE.spawnQueue = []; BATTLE.time=0; BATTLE.lastSpawn=0;
  BATTLE.result=null; BATTLE.speedMult=1; BATTLE.gold=0;
  // Spawn allies from team
  const startX = 160;
  const gap = 80;
  let idx=0;
  SAVE.team.forEach((hid,i)=>{
    if(hid<0) return;
    const h = GAMEDATA.heroes.find(x=>x.id===hid);
    if(!h) return;
    BATTLE.allies.push(makeUnit(h,true,startX+idx*gap,i));
    idx++;
  });
  // Jika team kosong, kasih Lydia default
  if(BATTLE.allies.length===0){
    const h = GAMEDATA.heroes[0];
    BATTLE.allies.push(makeUnit(h,true,startX,0));
  }
  // siapkan wave pertama
  prepareWave(0);
  BATTLE.active = true;
  $('b-level').textContent = lv.id+1;
  $('b-waves').textContent = lv.waves.length;
  updateSkillBar();
  goto('battle');
}
function prepareWave(i){
  if(i>=BATTLE.waves.length) return;
  $('b-wave').textContent = i+1;
  // Generate enemy group deterministically. Wave data punya scnid/mapid — kita generate
  // jumlah & jenis musuh berdasarkan battleValue dan id wave
  const w = BATTLE.waves[i];
  const bv = BATTLE.level.battleValue * (i+1);
  const count = 4 + i + Math.floor(BATTLE.level.id/3);
  BATTLE.spawnQueue = [];
  let t=0.5;
  const isLastWave = (i===BATTLE.waves.length-1);
  for(let k=0;k<count;k++){
    let eid = randi(0, Math.min(7+Math.floor(BATTLE.level.id/4), GAMEDATA.enemies.length-1));
    // pick normal enemy
    let cand = GAMEDATA.enemies.filter(e=>e.id>=12 && e.id<50);
    if(!cand.length) cand = GAMEDATA.enemies;
    const m = cand[Math.min(randi(0,cand.length-1),cand.length-1)];
    BATTLE.spawnQueue.push({t, m});
    t += rand(0.8, 1.6);
  }
  // Boss di wave terakhir setiap kelipatan 5 level, atau level>=7
  if(isLastWave && (BATTLE.level.id%5===4 || BATTLE.level.id>=7)){
    const bosses = GAMEDATA.enemies.filter(e=>e.id>=20 && e.id<46);
    if(bosses.length){
      const bm = bosses[randi(0,bosses.length-1)];
      BATTLE.spawnQueue.push({t:t+1, m:bm});
    }
  }
}

function spawnEnemy(m){
  const u = makeUnit(m,false,980,-1);
  // scale difficulty by level
  const diff = 1 + BATTLE.level.id*0.08;
  u.maxHp = Math.floor(u.maxHp*diff); u.hp=u.maxHp;
  u.atk = Math.floor(u.atk*diff*0.9);
  BATTLE.enemies.push(u);
}

function findNearestTarget(unit, enemyList){
  let best=null, bd=Infinity;
  for(const e of enemyList){
    if(!e.alive) continue;
    const d = Math.abs(e.x-unit.x);
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}

function dealDamage(src, target, dmg, isCrit){
  const d = Math.max(1, Math.floor(dmg - target.def*0.5 + rand(-dmg*0.1, dmg*0.1)));
  target.hp -= d;
  spawnDmgText(target.x, target.y - (target.mon.Height||100) - 10, d, isCrit?'#ffeb3b':'#fff');
  BATTLE.effects.push({type:'hit', x:target.x, y:target.y-40, t:0});
  if(target.hp<=0){ target.alive=false; target.hp=0;
    if(!target.isAlly){
      BATTLE.gold += Math.floor((target.mon.dropgold||10));
      // drop exp ke hero terdekat
      const near = findNearestTarget(target, BATTLE.allies);
      if(near && SAVE.ownedHeroes[near.mon.id]){
        SAVE.ownedHeroes[near.mon.id].exp += (target.mon.dropexp||20);
        checkLevelUp(near);
      }
      // chance drop
      if(Math.random()<0.15) BATTLE.gold += randi(5,20);
    }
  }
}
function checkLevelUp(unit){
  const h = SAVE.ownedHeroes[unit.mon.id];
  if(!h) return;
  const need = h.level * 100;
  if(h.exp >= need){
    h.exp -= need; h.level++;
    spawnDmgText(unit.x, unit.y-60, 'LEVEL UP!','#66ff66');
    // boost stat
    unit.maxHp = Math.floor((unit.mon.hp||200)*(1+(h.level-1)*0.12));
    unit.hp = unit.maxHp;
    unit.atk = Math.floor((unit.mon.damage||50)*(1+(h.level-1)*0.12));
  }
}
function spawnDmgText(x,y,txt,color){
  BATTLE.effects.push({type:'txt', x, y, txt, color:color||'#fff', t:0, vy:-30});
}

// ---------- SKILLS ----------
const SKILL_ACTIVE = {};
// skill id -> implementasi
function regSkill(id, fn){ SKILL_ACTIVE[id]=fn; }
function cooldownKey(id){ return 'sk_cd_'+id; }

// Skill generik: damage area / heal / buff. Implementasi berdasarkan attr (1=dmg, 0=buff)
GAMEDATA.skills.forEach(sk=>{
  regSkill(sk.id, (caster)=>{
    const value = sk.value;
    const range = sk.range;
    const isDmg = sk.attr===1;
    const enemies = BATTLE.enemies; const allies = BATTLE.allies;
    if(sk.name.includes('治療')||sk.name.includes('恢復')){
      allies.forEach(a=>{ if(a.alive){ a.hp=Math.min(a.maxHp,a.hp+value); spawnDmgText(a.x,a.y-80,'+'+value,'#66ff66'); }});
      BATTLE.effects.push({type:'heal', x:caster.x, t:0});
    }else if(isDmg){
      enemies.forEach(e=>{
        if(!e.alive) return;
        if(Math.abs(e.x-caster.x)<=range){ dealDamage(caster,e,caster.atk + value, false); }
      });
      BATTLE.effects.push({type:'blast', x:caster.x+range/2, y:caster.y-60, r:range*0.3, t:0});
    }else{
      // buff: berikan bonus atk/def/mspeed/speed
      allies.forEach(a=>{ if(a.alive && Math.abs(a.x-caster.x)<=800){
        a.atkBuff = (a.atkBuff||0)+value*0.01;
        spawnDmgText(a.x,a.y-80,sk.name,'#6ec8ff');
      }});
    }
  });
});

// ---------- SKILL BAR UI ----------
function updateSkillBar(){
  const bar = $('skillBar'); bar.innerHTML='';
  SAVE.skillBar.forEach((sid,slot)=>{
    const btn = document.createElement('div');
    btn.className='skill-btn';
    let sk=null, name='—';
    if(sid>=0){ sk = GAMEDATA.skills.find(s=>s.id===sid); if(sk) name=sk.name.slice(0,3); }
    btn.innerHTML = `<div style="padding:2px;">${name}</div>`;
    const cdEl = document.createElement('div'); cdEl.className='cd-t'; cdEl.textContent='';
    btn.appendChild(cdEl);
    btn.onclick = ()=>castSkill(slot);
    btn.dataset.slot = slot;
    bar.appendChild(btn);
  });
}
function castSkill(slot){
  if(!BATTLE.active || BATTLE.result) return;
  const sid = SAVE.skillBar[slot];
  if(sid<0) return;
  const key = cooldownKey(sid)+'_'+slot;
  if(BATTLE[key] && BATTLE[key]>0){ toast('冷卻中'); return; }
  // MP cost — pakai mp hero pertama
  const caster = BATTLE.allies.find(a=>a.alive);
  if(!caster) return;
  if(caster.mp < 30){ toast('魔力不足'); return; }
  caster.mp -= 30;
  const sk = GAMEDATA.skills.find(s=>s.id===sid);
  if(SKILL_ACTIVE[sid]) SKILL_ACTIVE[sid](caster);
  BATTLE[key] = sk.delt||10;
  // efek cast anim
  BATTLE.effects.push({type:'cast',x:caster.x,y:caster.y-60,t:0});
}

// ---------- BATTLE LOOP ----------
let lastT=0;
function loop(ts){
  const dt = Math.min(0.05, (ts-lastT)/1000) * (BATTLE.active?BATTLE.speedMult:1);
  lastT=ts;
  if(BATTLE.active && !BATTLE.result) tickBattle(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function tickBattle(dt){
  BATTLE.time += dt; BATTLE.bgScroll += dt*20;
  // spawn queue
  for(let i=BATTLE.spawnQueue.length-1;i>=0;i--){
    const s = BATTLE.spawnQueue[i];
    if(BATTLE.time >= s.t){ spawnEnemy(s.m); BATTLE.spawnQueue.splice(i,1); }
  }
  // wave complete?
  const enemiesAlive = BATTLE.enemies.filter(e=>e.alive).length;
  if(enemiesAlive===0 && BATTLE.spawnQueue.length===0){
    BATTLE.curWave++;
    if(BATTLE.curWave < BATTLE.waves.length){
      BATTLE.time = 0; prepareWave(BATTLE.curWave);
      toast('Wave '+ (BATTLE.curWave+1) + '!');
    }else{
      endBattle(true); return;
    }
  }
  // allies
  updateUnits(BATTLE.allies, BATTLE.enemies, dt, 1);
  updateUnits(BATTLE.enemies, BATTLE.allies, dt, -1);
  // projectiles
  for(let i=BATTLE.projectiles.length-1;i>=0;i--){
    const p = BATTLE.projectiles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    // hit?
    const list = p.targetIsAlly?BATTLE.allies:BATTLE.enemies;
    let hit=false;
    for(const u of list){
      if(!u.alive) continue;
      if(Math.abs(u.x-p.x)<25 && Math.abs(u.y-20-p.y)<50){
        if(p.isHeal){ u.hp=Math.min(u.maxHp,u.hp+p.dmg); spawnDmgText(u.x,u.y-60,'+'+p.dmg,'#66ff66'); }
        else dealDamage(p.src||u, u, p.dmg, false);
        hit=true; break;
      }
    }
    if(hit||p.life<=0||p.x<-50||p.x>1010) BATTLE.projectiles.splice(i,1);
  }
  // effects
  for(let i=BATTLE.effects.length-1;i>=0;i--){
    const e = BATTLE.effects[i]; e.t+=dt;
    if(e.type==='txt'){ e.y += e.vy*dt; e.vy += 20*dt; }
    if(e.t>1) BATTLE.effects.splice(i,1);
  }
  // skill cooldowns
  SAVE.skillBar.forEach((sid,slot)=>{
    const key = cooldownKey(sid)+'_'+slot;
    if(BATTLE[key]>0) BATTLE[key] = Math.max(0,BATTLE[key]-dt);
  });
  // allies mp regen
  BATTLE.allies.forEach(a=>{ if(a.alive) a.mp = Math.min(a.maxMp, a.mp+dt*8); });
  // ally lose? if all allies dead
  if(!BATTLE.allies.some(a=>a.alive)) endBattle(false);
  // HUD
  $('b-gold').textContent = BATTLE.gold;
  // update skill button CD visuals
  document.querySelectorAll('.skill-btn').forEach(btn=>{
    const slot = parseInt(btn.dataset.slot);
    const sid = SAVE.skillBar[slot];
    const key = cooldownKey(sid)+'_'+slot;
    const cd = BATTLE[key]||0;
    const cdt = btn.querySelector('.cd-t');
    if(cd>0){ btn.classList.add('cd'); btn.classList.remove('ready'); cdt.textContent=cd.toFixed(1); }
    else { btn.classList.remove('cd'); cdt.textContent='';
      const caster = BATTLE.allies.find(a=>a.alive);
      if(caster && caster.mp>=30 && sid>=0) btn.classList.add('ready');
      else btn.classList.remove('ready');
    }
  });
}
function updateUnits(units, enemies, dt, sideSign){
  for(const u of units){
    if(!u.alive) continue;
    u.animT += dt;
    if(u.atkTimer>0) u.atkTimer -= dt;
    if(u.stunned>0){ u.stunned-=dt; continue; }
    const target = findNearestTarget(u, enemies);
    if(!target){ // maju ke arah berlawanan
      u.x += u.speed*dt*sideSign * (u.slowed>0?0.5:1);
      if(u.slowed>0)u.slowed-=dt;
      continue;
    }
    const d = Math.abs(target.x - u.x);
    u.facing = (target.x > u.x) ? 1 : -1;
    if(d > u.range){
      u.x += (u.speed*dt*sideSign) * (u.slowed>0?0.5:1);
      u.isAttacking=false;
    }else{
      // in range: attack
      if(u.atkTimer<=0){
        u.isAttacking=true; u.atkAnimT=0.3; u.atkTimer=u.atkCooldown;
        // Ranged? gunakan projectile jika range>200
        if(u.range>200){
          BATTLE.projectiles.push({
            x:u.x, y:u.y-70,
            vx:(target.x-u.x)*1.5, vy:0,
            dmg: u.atk, life:1.5,
            targetIsAlly: (sideSign===1?false:true),
            isHeal: false, src: u,
            color: TYPE_COLORS[u.mon.type]?.body||'#ff5722'
          });
        }else{
          dealDamage(u, target, u.atk, Math.random()<0.1);
        }
      }
    }
    if(u.atkAnimT>0){ u.atkAnimT-=dt; if(u.atkAnimT<=0) u.isAttacking=false; }
    if(u.slowed>0)u.slowed-=dt;
  }
}
function endBattle(win){
  BATTLE.result = win?'win':'lose';
  BATTLE.active=false;
  if(win){
    SAVE.gold += BATTLE.gold + 50 + BATTLE.level.id*10;
    SAVE.gem += (BATTLE.level.id%5===4?3:1);
    if(!SAVE.clearedLevels.includes(BATTLE.level.id)) SAVE.clearedLevels.push(BATTLE.level.id);
    SAVE.unlockedLevelId = Math.max(SAVE.unlockedLevelId, BATTLE.level.id+1);
    save();
    showModal('🏆 勝利！',
      `獲得 <b style="color:#ffd95a">${BATTLE.gold+50+BATTLE.level.id*10}</b> 金幣<br>`+
      `獲得 <b style="color:#6ec8ff">${BATTLE.level.id%5===4?3:1}</b> 水晶<br>`+
      `關卡進度解鎖: 第 ${SAVE.unlockedLevelId+1} 關`,
      [{label:'返回地圖',cls:'btn-green',onClick:()=>goto('stage')}]);
  }else{
    showModal('💀 戰敗', '隊伍全滅！<br>可以升級英雄或調整隊伍後再挑戰。',
      [{label:'返回地圖',cls:'btn-red',onClick:()=>goto('stage')},{label:'復活(消耗1捲軸)',cls:'btn-blue',onClick:()=>{
        if(SAVE.scrolls<=0){ toast('沒有復活捲軸'); return; }
        SAVE.scrolls--; save();
        BATTLE.allies.forEach(a=>{a.alive=true;a.hp=a.maxHp;});
        BATTLE.active=true; BATTLE.result=null;
        $('modal').classList.add('hidden');
      }}]);
  }
}

// ---------- RENDER ----------
function render(){
  const c=ctx; c.clearRect(0,0,canvas.width,canvas.height);
  // sky gradient sudah dari CSS, tambah detail
  // clouds
  c.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<5;i++){
    const cx=((i*250-BATTLE.bgScroll*0.3)%1200+1200)%1200-100;
    c.beginPath(); c.arc(cx,80+i*10,30,0,Math.PI*2); c.arc(cx+25,75+i*10,25,0,Math.PI*2); c.arc(cx+50,85+i*10,20,0,Math.PI*2); c.fill();
  }
  // ground line
  c.fillStyle='#2a5018';
  c.fillRect(0, BATTLE.groundY+10, canvas.width, canvas.height-BATTLE.groundY);
  // grass detail
  c.strokeStyle='#4caf50'; c.lineWidth=2;
  for(let i=0;i<40;i++){
    const gx=((i*30-BATTLE.bgScroll)%canvas.width+canvas.width)%canvas.width;
    c.beginPath(); c.moveTo(gx,BATTLE.groundY+10); c.lineTo(gx-3,BATTLE.groundY); c.moveTo(gx,BATTLE.groundY+10); c.lineTo(gx+3,BATTLE.groundY+2); c.stroke();
  }
  if(!BATTLE.active){ return; }
  // draw units
  const all = [...BATTLE.allies,...BATTLE.enemies].filter(u=>u.alive).sort((a,b)=>a.y-b.y);
  for(const u of all){
    const hpPct = u.hp/u.maxHp;
    drawCharacter(c,u.x,u.y,u.mon, u.isAlly?0:1, u.facing, u.animT, hpPct, u.mp/u.maxMp, u.isAttacking, !u.alive, u.isBoss);
    // mp bar for allies
    if(u.isAlly){
      c.fillStyle='#000'; c.fillRect(u.x-25, u.y-2, 50, 3);
      c.fillStyle='#29b6f6'; c.fillRect(u.x-24, u.y-1, 48*(u.mp/u.maxMp), 1);
    }
  }
  // projectiles
  for(const p of BATTLE.projectiles) drawProjectile(c,p.x,p.y,p.color,p.isHeal);
  // effects
  for(const e of BATTLE.effects){
    if(e.type==='txt'){
      c.fillStyle = e.color; c.font='bold 16px sans-serif'; c.textAlign='center';
      c.globalAlpha = Math.max(0,1-e.t);
      c.fillText(e.txt, e.x, e.y);
      c.globalAlpha=1;
    }else if(e.type==='hit'){
      c.strokeStyle='rgba(255,255,255,'+(1-e.t*3)+')'; c.lineWidth=3;
      c.beginPath(); c.arc(e.x,e.y,15+e.t*30,0,Math.PI*2); c.stroke();
    }else if(e.type==='blast'){
      c.fillStyle='rgba(255,152,0,'+(0.6-e.t*0.6)+')';
      c.beginPath(); c.arc(e.x,e.y,e.r*(1+e.t*2),0,Math.PI*2); c.fill();
    }else if(e.type==='heal'){
      c.strokeStyle='rgba(102,255,102,'+(1-e.t)+')'; c.lineWidth=3;
      c.beginPath(); c.arc(e.x,BATTLE.groundY-40,40+e.t*30,Math.PI,0); c.stroke();
    }else if(e.type==='cast'){
      c.strokeStyle='rgba(110,200,255,'+(1-e.t*2)+')'; c.lineWidth=3;
      c.beginPath(); c.arc(e.x,e.y,10+e.t*40,0,Math.PI*2); c.stroke();
    }
  }
}

// ---------- STAGE SELECT ----------
function renderStage(){
  $('s-gold').textContent = SAVE.gold;
  $('s-gem').textContent = SAVE.gem;
  const box = $('levelList'); box.innerHTML='';
  const wrap = document.createElement('div');
  wrap.className='row';
  const cont = GAMEDATA.levels;
  cont.forEach(lv=>{
    const unlocked = lv.id <= SAVE.unlockedLevelId;
    const cleared = SAVE.clearedLevels.includes(lv.id);
    const card = document.createElement('div');
    card.className='card '+(cleared?'owned':'')+(unlocked?'':'');
    card.style.width='140px'; card.style.textAlign='center';
    card.innerHTML = `
      <div style="font-size:22px;">${cleared?'⭐':(unlocked?'⚔':'🔒')}</div>
      <div style="font-weight:bold;">第 ${lv.id+1} 關</div>
      <div style="font-size:11px;color:#aaa;">戰力 ${Math.floor(lv.battleValue)}</div>
      <div style="font-size:11px;">${lv.waves.length} wave</div>
    `;
    card.style.opacity = unlocked?'1':'0.4';
    if(unlocked){ card.onclick = ()=>{
      if(SAVE.team.every(x=>x<0)){ toast('隊伍空的！先去城鎮組隊'); return; }
      startBattle(lv.id);
    }; card.style.cursor='pointer'; }
    wrap.appendChild(card);
  });
  box.appendChild(wrap);
}

// ---------- TOWN ----------
function renderTown(){
  $('t-gold').textContent=SAVE.gold; $('t-gem').textContent=SAVE.gem;
  renderTeam(); renderHeroList(); renderShop(); renderSkills();
  document.querySelectorAll('.tab').forEach(t=>{
    t.onclick=()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p=>p.classList.add('hidden'));
      t.classList.add('active');
      $('tab-'+t.dataset.tab).classList.remove('hidden');
    };
  });
}
function renderTeam(){
  const box = $('teamSlots'); box.innerHTML='';
  for(let i=0;i<5;i++){
    const slot=document.createElement('div');
    slot.className='card'; slot.style.width='80px'; slot.style.height='90px';
    slot.style.textAlign='center';
    const hid = SAVE.team[i];
    if(hid<0){
      slot.innerHTML='<div style="color:#888;font-size:30px;margin-top:20px;">+</div><div style="font-size:11px;">空位</div>';
    }else{
      const h = GAMEDATA.heroes.find(x=>x.id===hid);
      const owned = SAVE.ownedHeroes[hid];
      const tc = TYPE_COLORS[h.type];
      slot.innerHTML = `<div style="width:50px;height:50px;background:${tc.body};border:3px solid ${QUALITY_COLORS[h.quality]};border-radius:50%;margin:4px auto;"></div>
        <div style="font-size:11px;">${h.name||'英雄'} Lv${owned.level}</div>`;
      slot.onclick = ()=>{ SAVE.team[i]=-1; save(); renderTeam(); renderHeroList(); };
      slot.title='點擊移出隊伍';
    }
    box.appendChild(slot);
  }
}
function renderHeroList(){
  const box=$('heroList'); box.innerHTML='';
  GAMEDATA.heroes.forEach(h=>{
    const owned = !!SAVE.ownedHeroes[h.id];
    const card = document.createElement('div');
    card.className='card '+(owned?'owned':'');
    if(SAVE.team.includes(h.id)) card.classList.add('selected');
    card.style.width='150px';
    const tc = TYPE_COLORS[h.type] || TYPE_COLORS[0];
    const level = SAVE.ownedHeroes[h.id]?.level || 0;
    const exp = SAVE.ownedHeroes[h.id]?.exp || 0;
    const cost = owned ? Math.floor((h.uplevelgold||500)*Math.pow(1.2,level)) : (h.opengold||0);
    const currency = '💰';
    card.innerHTML=`
      <div class="row" style="align-items:center;gap:8px;">
        <div style="width:40px;height:40px;background:${tc.body};border:2px solid ${QUALITY_COLORS[h.quality]};border-radius:50%;"></div>
        <div style="flex:1;">
          <div style="font-weight:bold;">${h.name} ${owned?`Lv${level}`:''}</div>
          <div style="font-size:10px;color:#aaa;">${tc.name} · HP ${h.hp} · ATK ${h.damage}</div>
        </div>
      </div>
      <div style="font-size:11px;margin-top:4px;color:#ddd;">${(h.describ||'').slice(0,30)}</div>
      <div style="margin-top:6px;" class="row">
        ${owned
          ? `<button class="btn-blue" style="padding:4px 8px;font-size:12px;" ${SAVE.gold<cost?'disabled':''}>升級 ${currency}${cost}</button>
             <button class="btn-green" style="padding:4px 8px;font-size:12px;">入隊</button>`
          : `<button class="btn-green" style="padding:4px 8px;font-size:12px;" ${SAVE.gold<cost?'disabled':''}>招募 ${currency}${cost}</button>`}
      </div>`;
    const btns = card.querySelectorAll('button');
    if(owned){
      btns[0].onclick = ()=>{
        if(SAVE.gold<cost) return;
        SAVE.gold-=cost; SAVE.ownedHeroes[h.id].level++; save(); renderTown(); toast(h.name+' 升級!');
      };
      btns[1].onclick = ()=>{
        const empty = SAVE.team.indexOf(-1);
        if(empty<0){ toast('隊伍已滿(5)，請先移出'); return; }
        if(SAVE.team.includes(h.id)){ toast('已在隊伍'); return; }
        SAVE.team[empty]=h.id; save(); renderTeam(); renderHeroList();
      };
    }else{
      btns[0].onclick = ()=>{
        if(SAVE.gold<cost) return;
        SAVE.gold-=cost; SAVE.ownedHeroes[h.id]={level:1,exp:0}; save(); renderTown(); toast('招募 '+h.name+' 成功！');
      };
    }
    box.appendChild(card);
  });
}
function renderShop(){
  const box=$('shopList'); box.innerHTML='';
  GAMEDATA.shop.forEach(g=>{
    // Skip real-money (type 0) — auto-free
    const card = document.createElement('div');
    card.className='card'; card.style.width='160px';
    const currency = g.type===2?'💎':'💰';
    const price = g.type===0?0:g.price; // type 0 (real money) = gratis di HTML5
    card.innerHTML=`
      <div style="font-weight:bold;">${g.name}</div>
      <div style="font-size:11px;color:#ccc;min-height:30px;">${g.describ}</div>
      <button class="btn-green" style="margin-top:4px;width:100%;padding:6px;">${g.type===0?'免費':currency+price}</button>
    `;
    card.querySelector('button').onclick = ()=>buyGood(g);
    box.appendChild(card);
  });
}
function buyGood(g){
  if(g.type===1 && SAVE.gold<g.price){ toast('金幣不足'); return; }
  if(g.type===2 && SAVE.gem<g.price){ toast('水晶不足'); return; }
  if(g.type===1) SAVE.gold-=g.price;
  else if(g.type===2) SAVE.gem-=g.price;
  // effect berdasarkan nama/id
  switch(g.id){
    case 0: SAVE.potions+=12; toast('+12 血瓶'); break;
    case 1: SAVE.scrolls+=12; toast('+12 復活捲軸'); break;
    case 7: SAVE.gold+=10000; break; // 1萬金
    case 8: SAVE.gold+=30000; break;
    case 9: SAVE.gold+=60000; break;
    case 10: SAVE.gold+=120000; break;
    case 11: SAVE.gold+=180000; break;
    case 24: SAVE.gold+=100000; SAVE.potions+=20; break;
    case 23: // boss pack: tambahkan 3 boss hero jika ada
      ['萊昂哈特','達古達','斯爾夫'].forEach(n=>{
        const b = GAMEDATA.heroes.find(h=>h.name===n);
        if(b && !SAVE.ownedHeroes[b.id]) SAVE.ownedHeroes[b.id]={level:1,exp:0};
      });
      SAVE.gold+=10000; toast('獲得Boss英雄+10000金'); break;
    case 25: SAVE.gem+=20; SAVE.gold+=5000; SAVE.potions+=5; SAVE.scrolls+=3; break;
    case 22: SAVE.gem+=350; SAVE.gold+=7000; SAVE.potions+=14; break;
    // crystal packs (type 0) free
    case 12: SAVE.gem+=20; break;
    case 13: SAVE.gem+=55; break;
    case 14: SAVE.gem+=120; break;
    case 15: SAVE.gem+=270; break;
    case 16: SAVE.gem+=840; break;
    case 17: SAVE.gem+=2000; break;
    case 18: SAVE.gem+=5000; break;
    case 2: // 史詩套裝 — tambah semua hero level+3
      Object.keys(SAVE.ownedHeroes).forEach(id=>{ SAVE.ownedHeroes[id].level+=3; });
      toast('全體英雄+3級！'); break;
    default:
      // buff lain
      SAVE.buffs[g.id] = (SAVE.buffs[g.id]||0)+1;
      toast(g.name+' 已購買');
  }
  save(); renderTown();
}
function renderSkills(){
  const slotsBox = $('skillSlots'); slotsBox.innerHTML='';
  for(let i=0;i<3;i++){
    const sid = SAVE.skillBar[i];
    const sk = sid>=0 ? GAMEDATA.skills.find(s=>s.id===sid) : null;
    const slot = document.createElement('div');
    slot.className='card'; slot.style.width='100px'; slot.style.textAlign='center';
    slot.innerHTML = sk ? `<b>${sk.name}</b><div style="font-size:10px;">${sk.describ.slice(0,20)}</div><button style="margin-top:4px;padding:2px 6px;font-size:11px;" class="btn-red">移除</button>`
                       : `<div style="color:#888;padding:10px;">空欄位 ${i+1}</div>`;
    if(sk){ slot.querySelector('button').onclick=()=>{ SAVE.skillBar[i]=-1; save(); renderSkills(); }; }
    slotsBox.appendChild(slot);
  }
  const box=$('skillList'); box.innerHTML='';
  GAMEDATA.skills.forEach(sk=>{
    const owned = !!SAVE.ownedSkills[sk.id];
    const inBar = SAVE.skillBar.includes(sk.id);
    const cost = sk.costgold;
    const card = document.createElement('div');
    card.className='card '+(owned?'owned':'')+(inBar?' selected':'');
    card.style.width='180px';
    card.innerHTML=`<b>${sk.name}</b><div style="font-size:11px;color:#ccc;">${sk.describ}</div>
      <div style="margin-top:4px;" class="row">
        ${owned
          ? `<button class="btn-green" style="padding:3px 6px;font-size:11px;" ${inBar?'disabled':''}>裝備</button>`
          : `<button class="btn-blue" style="padding:3px 6px;font-size:11px;" ${SAVE.gold<cost?'disabled':''}>學習 💰${cost}</button>`}
      </div>`;
    card.querySelector('button').onclick=()=>{
      if(!owned){
        if(SAVE.gold<cost) return;
        SAVE.gold-=cost; SAVE.ownedSkills[sk.id]=true; save(); renderTown();
      }else{
        const empty = SAVE.skillBar.indexOf(-1);
        if(empty<0){ toast('快捷欄已滿'); return; }
        SAVE.skillBar[empty]=sk.id; save(); renderSkills();
        if(BATTLE.active) updateSkillBar();
      }
    };
    box.appendChild(card);
  });
}

// ---------- BUTTON BINDINGS ----------
$('btn-start').onclick = ()=>{
  // reset save if first time
  if(!localStorage.getItem(SAVE_KEY)){ save(); }
  goto('stage');
};
$('btn-continue').onclick = ()=>{
  if(!localStorage.getItem(SAVE_KEY)){ toast('沒有存檔'); return; }
  goto('stage');
};
$('btn-reset').onclick = ()=>{
  showModal('⚠ 清除存檔','確定要刪除進度重新開始嗎？',[
    {label:'取消',cls:'btn-blue'},{label:'確定清除',cls:'btn-red',onClick:()=>{
      localStorage.removeItem(SAVE_KEY); SAVE=JSON.parse(JSON.stringify(DEFAULT_SAVE)); save();
      toast('存檔已清除');
      $('saveinfo').textContent='存檔已重置。';
    }}
  ]);
};
$('btn-how').onclick = ()=>{
  showModal('📖 玩法說明',
    `Brave Fighter 是一款 <b>橫向自動戰鬥</b> 遊戲：<br><br>`+
    `1. 英雄會自動向前走、攻擊範圍內的敵人<br>`+
    `2. 英雄在隊伍中最多 5 位，可以在「城鎮」招募、升級、替換<br>`+
    `3. 戰鬥中可以點擊下方 <b>技能紐</b> 手動施放技能（消耗魔力，有冷卻）<br>`+
    `4. 打贏關卡可獲得金幣、水晶，解鎖下一關<br>`+
    `5. 商店可以買血瓶、捲軸、金幣，所有付費項目（原 APK IAP）在 HTML5 版一律<b>免費/用金幣水晶購買</b><br>`+
    `6. 遊戲進度自動存於瀏覽器 localStorage<br><br>`+
    `⚠ 若戰鬥覺得慢，可點右上「1×」按鈕調整速度。`,
    [{label:'知道了',cls:'btn-green'}]);
};
$('btn-to-town').onclick = ()=>goto('town');
$('btn-to-stage').onclick = ()=>goto('stage');
$('btn-quit').onclick = ()=>{
  showModal('逃跑?','確定要放棄這場戰鬥嗎？',[
    {label:'繼續戰鬥',cls:'btn-blue'},{label:'逃跑',cls:'btn-red',onClick:()=>{BATTLE.active=false;goto('stage');}}
  ]);
};
$('btn-speed').onclick = ()=>{
  BATTLE.speedMult = BATTLE.speedMult===1?2:BATTLE.speedMult===2?3:1;
  $('btn-speed').textContent = BATTLE.speedMult+'×';
};

// Init: tampilkan info save
(function init(){
  if(localStorage.getItem(SAVE_KEY)){
    $('saveinfo').innerHTML = `✓ 找到存檔（金幣 ${SAVE.gold}，水晶 ${SAVE.gem}，英雄 ${Object.keys(SAVE.ownedHeroes).length}）`;
  }else{
    $('saveinfo').textContent = '※ 首次遊玩，點「開始冒險」建立新存檔';
  }
})();
</script>
